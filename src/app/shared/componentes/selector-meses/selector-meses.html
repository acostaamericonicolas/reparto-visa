<div class="selector">
  <button class="flecha" type="button" aria-label="Mes anterior" [disabled]="indice() <= 0" (click)="mover(-1)">
    <app-icono nombre="izquierda" />
  </button>
  <div class="tira" #tira role="tablist" aria-label="Meses" (scroll)="alDeslizar()"
       (touchstart)="empezo()" (wheel)="empezo()" (pointerdown)="empezo()">
    <span class="borde" aria-hidden="true"></span>
    @for (m of meses(); track m.id; let i = $index) {
      <button class="mes" type="button" role="tab" [class.elegido]="i === indice()" [class.apagado]="m.apagado" [attr.aria-selected]="i === indice()"
              [attr.aria-label]="m.largo + (m.detalle ? ', ' + m.detalle : '')" (click)="tocar(i)">
        <span class="nombre">{{ i === indice() ? m.largo : m.corto }}</span>
        @if (m.detalle) { <small>{{ m.detalle }}</small> }
      </button>
    }
    <span class="borde" aria-hidden="true"></span>
  </div>
  <button class="flecha" type="button" aria-label="Mes siguiente" [disabled]="indice() >= meses().length - 1" (click)="mover(1)">
    <app-icono nombre="derecha" />
  </button>
</div>
