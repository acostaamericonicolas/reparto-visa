@if (sesion.usuario(); as usuario) {
  <header class="barra">
    <div class="barra-interior">
      <a class="marca" routerLink="/">Reparto Visa</a>
      <nav aria-label="Secciones">
        <a routerLink="/" [class.activo]="enResumen()">Resumen</a>
        <a routerLink="/graficos" routerLinkActive="activo">Gráficos</a>
        <a routerLink="/hogar" routerLinkActive="activo">Hogar</a>
        <a routerLink="/personas" routerLinkActive="activo">Personas</a>
      </nav>
      <div class="usuario">
        <span class="ayuda">{{ usuario.email }}</span>
        <app-boton-tema />
        <button class="boton boton-chico" (click)="sesion.salir()">Salir</button>
      </div>
    </div>
  </header>
  @if (hayVersionNueva()) {
    <div class="pagina error-global">
      <div class="aviso advertencia fila">
        Hay una versión nueva de la app.
        <button class="boton boton-chico" (click)="recargar()">Actualizar</button>
      </div>
    </div>
  }
  @if (datos.error()) {
    <div class="pagina error-global"><div class="aviso error">{{ datos.error() }}</div></div>
  }
} @else {
  <!-- Sin sesión (login) no hay barra: el sol/luna va solo en la esquina -->
  <div class="tema-suelto"><app-boton-tema /></div>
}
<router-outlet />
